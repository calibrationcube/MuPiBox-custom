@if (lg()) {
<!-- Lagune: the artist's picture in the corner (back), the title, the albums as a paged grid (app/lagune) -->
<ion-content class="medialist-content lg-page" [scrollY]="false">
  <!-- (a folder level opened by its path has no picture of its own: then the first entry's artist picture) -->
  <mupi-lg-header
    icon="lg-arrow-left"
    [coverOf]="artist()?.coverMedia?.artistcover || artist()?.coverMedia?.cover ? artist()?.coverMedia : media()?.[0]"
    [title]="artist()?.name ?? ''"
    (cornerClicked)="goBack()">
  </mupi-lg-header>
  <mupi-loading [loading]="isLoading()"></mupi-loading>
  @if (unavailable()) {
    <mupi-media-unavailable [nas]="artist()?.coverMedia?.type === 'nas'" [spotify]="spotifyUnavailable()"></mupi-media-unavailable>
  }
  <mupi-lg-tile-pages [data]="swiperData()" [listKey]="category() + '|' + (artist()?.name ?? '') + '|' + (artist()?.coverMedia?.libraryPath ?? artist()?.coverMedia?.nasPath ?? '')" (elementClicked)="coverClicked($event.data)"></mupi-lg-tile-pages>
</ion-content>
} @else {
<ion-header class="medialist-header" [class.km-r2]="r2()">
  @if (r2()) {
    <!-- km themes, design round 2: back (always "back to the choice"), the title, "Läuft gerade" between title and
         status, WiFi/battery with the listening time -->
    <div class="km-bar">
      <button class="km-hbtn" type="button" (click)="goBack()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
      </button>
      <div class="km-htitle"><span class="km-ht1">{{ artist()?.name }}</span></div>
      <mupi-now-playing-pill></mupi-now-playing-pill>
      <mupi-km-status-group></mupi-km-status-group>
    </div>
  } @else {
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{artist()?.name}}</ion-title>
    <span slot="end" class="mupihat-icon-container"><mupi-status></mupi-status></span>
  </ion-toolbar>
  }
</ion-header>

<ion-content class="medialist-content">
  <mupi-loading [loading]="isLoading()"></mupi-loading>
  @if (unavailable()) {
    <mupi-media-unavailable [nas]="artist()?.coverMedia?.type === 'nas'" [spotify]="spotifyUnavailable()"></mupi-media-unavailable>
  }
  <mupi-swiper [data]="swiperData()" [positionKey]="category() + '|' + (artist()?.name ?? '') + '|' + (artist()?.coverMedia?.libraryPath ?? artist()?.coverMedia?.nasPath ?? '')" (elementClicked)="this.coverClicked($event.data)"></mupi-swiper>
</ion-content>
}
