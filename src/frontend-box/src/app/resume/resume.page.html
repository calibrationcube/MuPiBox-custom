@if (lg()) {
<!-- Lagune: the "Weiterhören" symbol in the corner (back), the entries as a paged grid (app/lagune) -->
<ion-content class="resume-content lg-page" [scrollY]="false">
  <mupi-lg-header icon="lg-history" [title]="displayTexts.text('resumeTitle')" (cornerClicked)="goBack()"></mupi-lg-header>
  <mupi-loading [loading]="isLoading()"></mupi-loading>
  <mupi-lg-tile-pages [data]="swiperData()" (elementClicked)="coverClicked($event.data)"></mupi-lg-tile-pages>
</ion-content>
} @else {
<ion-header class="medialist-header">
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-back-button icon="arrow-back-outline" defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ km() ? displayTexts.text('resumeTitle') : 'Resume' }}</ion-title>
    <span slot="end" class="mupihat-icon-container"><mupi-status></mupi-status></span>
  </ion-toolbar>
</ion-header>

<ion-content class="resume-content">
  <mupi-loading [loading]="isLoading()"></mupi-loading>
  <mupi-swiper [data]="swiperData()" (elementClicked)="this.coverClicked($event.data)"></mupi-swiper>
</ion-content>
}
